name: Unit Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Build & Test
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Xcode Cache
        uses: irgaly/xcode-cache@v1
        with:
          key: xcode-cache-deriveddata-${{ github.sha }}
          restore-keys: xcode-cache-deriveddata-
          swiftpm-cache-key: spm-soucepackages-${{ hashFiles('Anytype.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          swiftpm-cache-restore-keys: spm-soucepackages-
          cache-read-only: true

      # The macos-26 runner pool is heterogeneous: SDK headers carry different mtimes
      # across runners. Clang's cached precompiled modules are mtime-locked to the runner
      # that built them, so a restored ModuleCache fails on a different runner with
      # "file has been modified since the module file was built". Drop it so Clang rebuilds
      # modules against the current runner's SDK; the rest of the cached DerivedData stands.
      - name: Clear stale module cache
        run: rm -rf ~/Library/Developer/Xcode/DerivedData/*/ModuleCache.noindex || true

      - name: Prepare deps
        uses: ./.github/actions/prepare-deps

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: '26.1'

      - name: Install iOS Platform
        uses: ./.github/actions/install-ios-platform

      - name: Download Middleware
        run: make setup-middle-ci
        env:
          MIDDLEWARE_TOKEN: ${{ secrets.MIDDLEWARE_TOKEN }}

      - name: Build for testing
        run: bundle exec fastlane build_for_tests
        env:
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 900
          FASTLANE_XCODE_LIST_TIMEOUT: 900

      - name: Run unit tests
        if: false  # Temporarily disabled - tests hanging on CI
        run: bundle exec fastlane tests skip_notify:true
        env:
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 900
          FASTLANE_XCODE_LIST_TIMEOUT: 900
